[project]
name = "trading-strategy-lab"
version = "0.1.0"
description = "Backtests five popular day-trading strategies on the same data and paper-trades them via Alpaca to compare win rates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "matplotlib>=3.8",
    "alpaca-py>=0.21",
    "python-dotenv>=1.0",
]

[project.scripts]
trading-lab = "trading_lab.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "trading_lab"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "black>=24",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
