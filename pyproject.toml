[project]
name = "trading-strategy-lab"
version = "0.1.0"
description = "Backtests five popular day-trading strategies on the same data and paper-trades them via Alpaca to compare win rates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "matplotlib>=3.8",
    "alpaca-py>=0.21",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# News-sentiment study only (FinBERT scoring on GitHub Actions). Kept out of the
# default install: the lab's daily workflows and the laptop never need torch.
news = [
    "torch>=2.5",
    "transformers>=4.44",
    "pysentiment2>=0.1.1",
]

[project.scripts]
trading-lab = "trading_lab.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "trading_lab"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "black>=24",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
