name: Weekly backtest + monthly tune

# Every Saturday, on the rolling 60-day window:
#   - backtest: refresh results/trades.csv (now with SPY-adjusted P&L) and
#     results/REVIEW.md, the "is anything beating the market?" report.
# First Saturday of each month only (or on manual dispatch):
#   - tune: grid search scored on SPY-adjusted expectancy, report-only. Weekly
#     winners churned 4-5 times in 7 runs, so promotion to live trading is off
#     (config.trade_tuned_variants) and weekly runs only added noise.
#   - regime: walk-forward report + live model, kept for monitoring; regime
#     variants are off (config.trade_regime_variants).
# Not time-critical, so GitHub's best-effort cron is fine here — no external
# cron-job.org slot needed (see docs/external-cron.md).
on:
  schedule:
    - cron: "0 8 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: results-commit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150  # monthly tune over 10 symbols is the long pole
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Monthly run? (first Saturday of the month, or manual)
        id: when
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%-d)" -le 7 ]; then
            echo "monthly=true" >> "$GITHUB_OUTPUT"
          else
            echo "monthly=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Tune on the rolling 60-day window (monthly, report-only)
        if: steps.when.outputs.monthly == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: uv run trading-lab tune
      - name: Refresh the backtest journal on the rolling window
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: uv run trading-lab backtest
      - name: Re-fit the regime filter (monthly, monitoring only)
        if: steps.when.outputs.monthly == 'true'
        run: uv run trading-lab regime
      - name: Refresh the review (SPY-adjusted verdicts + decision gate)
        run: uv run trading-lab review
      - name: Commit the tuning report, refreshed backtest, and regime filter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/TUNING.md results/tuning_shrinkage.png results/tuning_history.csv results/tuned_params.json
          git add results/trades.csv results/RESULTS.md results/equity_curves.png
          git add results/REGIME.md results/regime_oos.png results/regime_model.joblib results/REVIEW.md
          git diff --cached --quiet && echo "No weekly changes." && exit 0
          git commit -m "weekly: backtest + review refresh $(date -u +%F)"
          git push
