name: Weekly tune

# Saturday, after the trading week: grid-search parameters on the rolling
# 60-day window and commit the tuning report plus a row per strategy to
# results/tuning_history.csv — the week-over-week stability record that says
# whether "best" parameters persist or churn (churn = the grid fits noise).
# Not time-critical, so GitHub's best-effort cron is fine here — no external
# cron-job.org slot needed (see docs/external-cron.md).
on:
  schedule:
    - cron: "0 8 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # a full tune took ~46 min locally; runners are slower
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Tune on the rolling 60-day window
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: uv run trading-lab tune
      - name: Commit the tuning report and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/TUNING.md results/tuning_shrinkage.png results/tuning_history.csv results/tuned_params.json
          git diff --cached --quiet && echo "No tuning changes." && exit 0
          git commit -m "tune: weekly stability run $(date -u +%F)"
          git push
