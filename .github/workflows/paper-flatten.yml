name: Paper flatten (EOD)

# Close everything before the bell: 19:40 UTC = 15:40 ET during EDT. The
# primary trigger is cron-job.org's on-time workflow_dispatch; these GitHub
# crons are the fallback. flatten() now no-ops when the market is closed, so a
# late fallback run (GitHub cron can fire 15-25 min late) is harmless instead
# of leaking overnight positions via un-fillable after-hours orders — the bug
# on 2026-09-17. The 20:40 run is the EST-season safety net (a summer no-op).
on:
  schedule:
    - cron: "40 19 * * 1-5"
    - cron: "40 20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  flatten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Close all paper positions
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: uv run trading-lab paper --flatten
