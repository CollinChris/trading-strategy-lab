name: Paper flatten (EOD)

# Close everything before the bell. The primary trigger is cron-job.org's
# 15:40 ET workflow_dispatch; these GitHub crons are a fallback.
#
# Timing comes from Alpaca's clock, not the trigger time: flatten acts only in
# the last 25 minutes before the real close (13:00 on half-days) and no-ops
# outside it — so GitHub's UTC crons, which drift an hour with DST and often
# fire hours late, can neither flatten early nor queue after-hours orders.
#
# Layers of backup for a lost run (GitHub outages on 2026-10-05 and
# 2026-11-11 never started this job):
#   1. every paper scan inside the closing window also flattens (15:40, 15:50);
#   2. the first scan of the next session closes anything held over.
#
# Own concurrency group: GitHub keeps one pending run per group, and a shared
# group let a queued scan cancel a pending flatten.
on:
  schedule:
    - cron: "40 19 * * 1-5"
    - cron: "40 20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: paper-flatten
  cancel-in-progress: false

jobs:
  flatten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Close all paper positions
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: uv run trading-lab paper --flatten
